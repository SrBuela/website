


<!DOCTYPE html>
<html>
<head>
    <title>Smart Study Buddy</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eef5ff;
        }

        h1 { color: #2457a6; }

        .card {
            display: inline-block;
            width: 200px;
            margin: 15px;
            padding: 15px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px #aaa;
        }

        .card img {
            width: 100px;
            height: 100px;
        }

        button {
            padding: 10px 20px;
            background: #2457a6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #173d78;
        }
    </style>
</head>

<body>

    <h1>Smart Study Buddy</h1>
    <p>Learn smarter with spaced repetition!</p>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/2995/2995322.png">
        <h3>Flashcards</h3>
        <p>Revise your lessons easily.</p>
        <button onclick="alert('Flashcards Started!')">Start</button>
    </div>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/3406/3406780.png">
        <h3>Quiz</h3>
        <p>Test your knowledge.</p>
        <button onclick="alert('Quiz Started!')">Take Quiz</button>
    </div>

    <div class="card">
        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135755.png">
        <h3>Progress</h3>
        <p>Track your learning.</p>
        <button onclick="alert('Progress: 75%')">View</button>
    </div>

</body>
</html>
